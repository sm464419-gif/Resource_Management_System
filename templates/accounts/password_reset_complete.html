{% extends 'core/base.html' %}
{% load static %}

{% block title %}Password reset{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <span class="auth-icon success"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></span>
    <h1>Password updated</h1>
    <p class="auth-sub">Your password was reset successfully. You can now log in with the new one.</p>
    <div class="auth-actions">
      <a class="btn btn-primary btn-lg" href="{% url 'accounts:login' %}">Log in</a>
    </div>
  </div>
</section>
{% endblock %}
